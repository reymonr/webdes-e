<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Form</title>
</head>
<body>
    <h1>HTML Form</h1>

    <p>Latihan membuat komponen Form</p>

    <form action="#" method="post">
        <table>
            <tr>
                <td> <label for="nama_depan">Nama Depan</label> </td>
                <td>:</td>
                <td> <input type="text" name="nama_depan" id="nama_depan"> </td>
            </tr>
            <tr>
                <td> <label for="nama_belakang">Nama Belakang</label> </td>
                <td>:</td>
                <td> <input type="text" name="nama_belakang" id="nama_belakang"> </td>
            </tr>
            <tr>
                <td> <label for="deskripsi">Deskripsi Diri</label> </td>
                <td>:</td>
                <td> <textarea name="deskripsi" id="deskripsi"></textarea> </td>
            </tr>
            <tr>
                <td> <label for="email">Email</label> </td>
                <td>:</td>
                <td> <input type="email" name="email" id="email"> </td>
            </tr>
            <tr>
                <td> <label for="gender">Gender</label> </td>
                <td>:</td>
                <td> 
                    <input type="radio" name="gender" id="gender" value="Male"> Male
                    <input type="radio" name="gender" id="gender" value="Female"> Female
                </td>
            </tr>
            <tr>
                <td> <label for="hobi">Hobi</label> </td>
                <td>:</td>
                <td> 
                    <input type="checkbox" name="hobi" id="hobi" value="Membaca"> Membaca
                    <input type="checkbox" name="hobi" id="hobi" value="Menulis"> Menulis
                    <input type="checkbox" name="hobi" id="hobi" value="Olahraga"> Olahraga
                </td>
            </tr>
            <tr>
                <td> <label for="fakultas">Fakultas</label> </td>
                <td>:</td>
                <td> 
                    <select name="fakultas" id="fakultas">
                        <option value="FILKOM">Fakultas Ilmu Komputer</option>
                        <option value="FEB">Fakultas Ekonomi dan Bisnis</option>
                        <option value="FFIL">Fakultas Filsafat</option>
                    </select>
                </td>
            </tr>
            <tr>    
                <td> <label for="tanggal_lahir">Tanggal Lahir</label> </td>
                <td>:</td>
                <td> <input type="date" name="tanggal_lahir" id="tanggal_lahir"> </td>
            </tr>
            <tr>
                <td colspan="3">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
